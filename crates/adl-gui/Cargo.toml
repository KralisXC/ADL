[package]
name = "adl-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "adl-gui"
path = "src/main.rs"

[dependencies]
adl-core = { path = "../adl-core" }
adl-plugin = { path = "../adl-plugin" }
adl-app = { path = "../adl-app" }
# 纯 Rust 原生 GUI：不依赖 WebView2，跨 Windows/Linux/macOS。
# 用 glow(OpenGL) 后端而非默认的 wgpu：体积小很多，且在虚拟机/远程桌面
# 等 wgpu 后端不稳定（surface 丢失会让事件循环直接退出）的环境更可靠。
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
# 托盘菜单（跨平台，Windows 上只需默认后端）。
tray-icon = { version = "0.25.1", default-features = false }
muda = { version = "0.20", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Windows 平台胶水：单实例（命名互斥量）、唤醒（命名事件）、
# 休眠/唤醒通知（PowerRegisterSuspendResumeNotification）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
] }
