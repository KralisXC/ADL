[package]
name = "adl-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "adl-gui"
path = "src/main.rs"

[dependencies]
adl-core = { path = "../adl-core" }
adl-plugin = { path = "../adl-plugin" }
adl-app = { path = "../adl-app" }
# 自研 UI 组件库（主题令牌 + 控件 + 声明式表单/表格）
adl-ui = { path = "../adl-ui" }
# 纯 Rust 原生 GUI：不依赖 WebView2，跨 Windows/Linux/macOS。
# 同时编入两个渲染后端，运行时用 ADL_RENDERER 选择：
#   - glow (OpenGL)  —— 默认，兼容性最好（虚拟机/远程桌面/老核显都能开）
#   - wgpu           —— 走 Vulkan / DX12 / Metal，设 ADL_RENDERER=wgpu
#                       （想强制 Vulkan 再加 WGPU_BACKEND=vulkan）
#
# 🔴 `clipboard` 必须显式开：它本来在 eframe 的 default 里
# （eframe-0.37.0/Cargo.toml 的 default = ["accesskit", "clipboard", ...]），
# 而我们 `default-features = false` 把这整组关掉了 —— 结果 Ctrl+V 粘不进
# 下载地址、Ctrl+C 也拷不走文件路径，界面上完全没反应，看着像"输入框坏了"。
# `links` 顺带开：插件页里将来会有文档链接。
#
# 🔴 `accesskit` 同样在 default 里、同样被关掉了 —— 它开着的时候 egui 会把整棵
# 控件树通过 Windows UI Automation 暴露出去。少它的后果不是功能坏了，而是
# **界面对自动化完全不可见**：按名字找按钮、读标签文字全都做不到，只能拿截图
# 对比像素去猜坐标（本机 DPI 150%，窗口原点还会随启动变化，猜一次错一次）。
# 打开之后 `mcp__windows__Snapshot` 能直接列出「保存设置」「并发上限 8」这类控件。
#
# 🔴 `x11` / `wayland` 也是 default 里的，同样被关掉了 —— 在 Linux 上
# 少了它们 winit 建不出窗口，程序启动即 panic「no compatible backend」。
# 这两个 feature 在 Windows/macOS 上是空操作（winit 内部按 cfg(unix) 才编
# x11-dl / wayland-client），所以无条件开着最省心。
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "glow",
    "wgpu",
    "default_fonts",
    "links",
    "x11",
    "wayland",
] }
# 托盘菜单（跨平台，Windows 上只需默认后端）。
# 🔴 `default-features = false` 在 Linux 上会直接编译失败：
# tray-icon-0.25.1/src/lib.rs:128 有
#   compile_error!("either the `libappindicator` or `ksni` feature must be enabled on Linux and BSD")
# 所以 Linux 那边必须从下面那个 target 表里补一个后端（我们选 ksni：
# 纯 Rust + zbus，不依赖 GTK/AppIndicator 那套 C 库，也不用装 libxdo）。
# 对应地 muda 保持 default-features = false，Linux 上走 `noop` 平台实现
# （菜单项画不出来，但不 panic；要真能弹菜单得引 gtk3，那是发行版级依赖）。
tray-icon = { version = "0.25.1", default-features = false }
muda = { version = "0.20", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 插件市场要把 index.json 与插件包拉回来。用的就是下载那一套客户端
# （`adl_core::http::build_client`，UA / 代理 / HTTP1 全跟设置一致），
# 所以这里必须能直接写 reqwest 的类型。
reqwest = { workspace = true }
# 详情页要解 `.adl` 控制文件里的十六进制位图
hex = { workspace = true }
# 插件以 zip 压缩包分发（GitHub Releases），装完就把包删掉。
# 🔴 default features 会拉 bzip2/lzma/ppmd/zstd/aes，那些 crate 本机缓存里没有，
# 只能开 deflate —— 我们自己打包时用 deflate 就够了。
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2"] }
# Windows 平台胶水：单实例（命名互斥量）、唤醒（命名事件）、
# 休眠/唤醒通知（PowerRegisterSuspendResumeNotification）、
# 选择文件夹对话框（SHBrowseForFolderW，系统自带，不引第三方依赖）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
# Linux / BSD：tray-icon 必须补一个后端，否则 lib.rs:128 直接 compile_error!
# （`either the libappindicator or ksni feature must be enabled on Linux and BSD`）。
# 选 ksni：纯 Rust + zbus，不依赖 GTK / AppIndicator 的 C 库，也不用装 libxdo。
# 注意这张表必须放在文件最后 —— 表头之后的裸依赖都会并进这张表。
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
