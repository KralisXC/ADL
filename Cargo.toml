[workspace]
resolver = "2"
members = ["crates/adl-core", "crates/adl-app", "crates/adl-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
futures-util = "0.3.34"
thiserror = "2.0.18"
url = "2.5.8"
toml = "0.8.2"
clap = { version = "=4.5.26", features = ["derive"] }

# ── 体积：DESIGN.md §1.3 ────────────────────────────────────────────
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# ── MSVC 14.51 的 D8050：只给依赖关调试信息（DESIGN.md §7.2）────────
[profile.dev.package."*"]
debug = false
