<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; width: 280px; padding: 12px; margin: 0; color: #1b2b29; background: #f0f7f7; }
      h1 { font-size: 14px; margin: 0 0 8px; color: #2b7a70; }
      label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
      input[type="number"] { width: 80px; padding: 2px 4px; }
      button { margin-top: 8px; padding: 4px 10px; border: 0; border-radius: 8px; background: #2b9a8a; color: #fff; cursor: pointer; }
      #status { margin-top: 8px; white-space: pre-wrap; word-break: break-all; color: #456; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>ADL 下载桥</h1>
    <label><input type="checkbox" id="enabled" /> 接管浏览器下载</label>
    <label>本机端口 <input type="number" id="port" min="1" max="65535" /></label>
    <button id="test">测试连接</button>
    <div id="status">就绪</div>
    <script src="popup.js"></script>
  </body>
</html>
