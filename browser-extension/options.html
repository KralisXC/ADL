<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ADL 下载桥 - 设置</title>
    <style>
      body { font: 14px/1.6 system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #1b2b29; background: #f0f7f7; }
      h1 { color: #2b7a70; }
      .card { background: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: 0 4px 20px rgba(0,0,0,.04); margin-bottom: 16px; }
      label { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
      input[type="number"] { width: 100px; padding: 4px 6px; }
      button { padding: 6px 14px; border: 0; border-radius: 10px; background: #2b9a8a; color: #fff; cursor: pointer; }
      code { background: #eef5f4; padding: 1px 5px; border-radius: 5px; }
      .muted { color: #667; font-size: 13px; }
      #status { margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>ADL 下载桥 · 设置</h1>
    <div class="card">
      <label><input type="checkbox" id="enabled" /> <b>启用下载接管</b>（浏览器产生下载时转交 ADL）</label>
      <label>ADL 本地 API 端口 <input type="number" id="port" min="1" max="65535" /> <span class="muted">（默认 17800，需与 ADL 一致）</span></label>
      <button id="test">测试连接</button>
      <div id="status" class="muted"></div>
    </div>
    <div class="card">
      <p><b>使用说明</b></p>
      <ol class="muted">
        <li>先启动 ADL 桌面程序（它会监听 <code>127.0.0.1:17800</code>）。</li>
        <li>浏览器里点普通下载链接、或右键链接选「使用 ADL 下载」，下载会转交给 ADL。</li>
        <li>ADL 未运行或接管失败时，浏览器会照常自己下载，不会丢链接。</li>
        <li>需要登录的站：扩展会把该 URL 的 Cookie 一起转发（受 <code>cookies</code> 权限）。</li>
      </ol>
    </div>
    <script src="options.js"></script>
  </body>
</html>
